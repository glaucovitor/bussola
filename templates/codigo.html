{% extends "base.html" %}
{% set area_participante = true %}
{% block title %}Participar{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;text-align:center">
  <h1>Participar de uma oficina</h1>
  <p class="muted small">Digite o código exibido pelo condutor.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="codigo" maxlength="6" required autofocus autocomplete="off"
           style="text-align:center;font-size:1.6rem;letter-spacing:6px;text-transform:uppercase" aria-label="Código da oficina">
    <div style="margin-top:16px"><button>Entrar</button></div>
  </form>
</div>
{% endblock %}
